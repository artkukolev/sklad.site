<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад IThub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f2fa;--s1:#fff;--s2:#f0f0fa;--bd:rgba(30,30,70,.1);--ink:#15162b;--mut:#6d6f93;--ac:#6a5cf5;--ac2:#4f8bff;--ok:#12803f;--okb:#e3f6ea;--no:#c0267a;--nob:#fde8f2;--wt:#9a6a00;--wtb:#fff3d1;--sh:0 1px 2px rgba(20,20,60,.06),0 8px 24px rgba(20,20,60,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e1d;--s1:#16172e;--s2:#1e2040;--bd:rgba(255,255,255,.08);--ink:#f4f4fc;--mut:#9b9dc4;--ac:#8d80ff;--ac2:#6aa0ff;--ok:#4ade80;--okb:#14352a;--no:#f472b6;--nob:#3a1a30;--wt:#fbbf24;--wtb:#3a2f12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e1d;--s1:#16172e;--s2:#1e2040;--bd:rgba(255,255,255,.08);--ink:#f4f4fc;--mut:#9b9dc4;--ac:#8d80ff;--ac2:#6aa0ff;--ok:#4ade80;--okb:#14352a;--no:#f472b6;--nob:#3a1a30;--wt:#fbbf24;--wtb:#3a2f12;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent);background-attachment:fixed;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:26px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--bd);background:color-mix(in srgb,var(--s1) 70%,transparent);backdrop-filter:blur(14px)}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;padding:0 12px 18px;display:flex;align-items:center;gap:10px}
.brand i,.mtop i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.tb{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--mut);font-weight:600;padding:11px 12px;border-radius:12px;text-align:left;width:100%;min-height:44px}
.tb:hover{background:var(--s2)}.tb.on{background:var(--s2);color:var(--ink);box-shadow:inset 3px 0 0 var(--ac)}.tb.on svg{color:var(--ac)}
.hdl{margin-top:auto;color:var(--mut);font-size:12px;padding:0 12px;display:flex;justify-content:space-between;align-items:center}
.th2{border:1px solid var(--bd);background:var(--s1);border-radius:10px;width:36px;height:36px;font-size:16px}
main{padding:34px 32px 60px;max-width:960px;width:100%;margin:0 auto;min-height:100dvh}
h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;min-height:40px;flex-wrap:wrap}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.k{padding:16px 18px;text-align:left;display:block;width:100%;color:inherit}
button.k:hover,a.k:hover{border-color:var(--ac)}
.k s{display:block;text-decoration:none;color:var(--mut);font-size:13px;font-weight:500}.k b{font-size:30px;letter-spacing:-.02em;font-weight:700}.k b.a{color:var(--ac)}.k b.w{color:var(--no)}
.k.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;grid-column:1/-1}.k.hero s{color:rgba(255,255,255,.8)}
.lb{color:var(--mut);font-size:12px;letter-spacing:.08em;font-weight:600;margin:22px 4px 10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--s2);min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pr{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.btn.dg{color:var(--no)}.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.ch{background:var(--s1);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--mut);min-height:36px}.ch.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.in{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;min-height:44px}
.in:focus{border-color:var(--ac);outline:0}
.lst{overflow:hidden}
.ri{padding:14px 18px;border-bottom:1px solid var(--bd)}.ri:last-child{border:0}.ri.clk{cursor:pointer}.ri.clk:hover{background:var(--s2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px}
.pl{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap;border:0;background:var(--s2);color:var(--mut)}
.pl.ok{background:var(--okb);color:var(--ok)}.pl.rej{background:var(--nob);color:var(--no)}.pl.wait{background:var(--wtb);color:var(--wt)}
.pl.out{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}.pl.done{background:var(--s2);color:var(--mut)}.pl.work{background:var(--wtb);color:var(--wt)}.pl.idea{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.it{display:flex;gap:14px;align-items:center;padding:12px;cursor:pointer;min-height:88px;transition:border-color .15s}
.it:hover{border-color:var(--ac)}
.th{width:64px;height:64px;border-radius:14px;background:var(--s2);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--mut)}
.nm{flex:1;min-width:0}.nm b{display:block;overflow-wrap:anywhere;font-weight:600}
.loc{display:inline-block;font-size:11px;font-weight:600;background:var(--s2);border-radius:99px;padding:2px 9px;color:var(--mut);margin:4px 4px 0 0}
.loc.warn{background:var(--nob);color:var(--no)}.loc.rsv{background:var(--wtb);color:var(--wt)}
.sp{display:flex;align-items:center;gap:6px;flex:none}
.sp button{width:40px;height:40px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:22px;line-height:1;font-weight:600}
.sp button:active{transform:scale(.94)}
.sp input{width:64px;height:40px;text-align:center;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:0;font-weight:700;-moz-appearance:textfield}
.qty{font-size:22px;font-weight:700;min-width:44px;text-align:right}
dialog{border:1px solid var(--bd);border-radius:22px;background:var(--s1);color:var(--ink);width:min(480px,94vw);padding:22px;max-height:92dvh;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(8,8,24,.6);backdrop-filter:blur(4px)}
dialog label.l{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.pv{width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--s2);object-fit:cover;display:grid;place-items:center;color:var(--mut);margin-bottom:10px}
.fb{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.fb .btn{flex:1}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--ac);color:#fff}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);z-index:30;font-weight:500;max-width:92vw}
.toast[hidden]{display:none}.toast button{border:0;background:none;color:var(--ac2);font-weight:700}
.note{padding:12px 16px;border-radius:14px;background:var(--wtb);color:var(--wt);font-size:13px;font-weight:500;margin-bottom:16px}.note[hidden]{display:none}
.prog{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.mtop{display:none}
@media print{.side,.toast,.mtop,button,.bar,#sq,.note{display:none!important}.shell{display:block}main{padding:0}body{background:#fff;color:#000}.card{box-shadow:none}}
@media (max-width:860px){
  .shell{display:block}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--bd);z-index:20;gap:0}
  .brand,.hdl{display:none}
  .tb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;text-align:center;box-shadow:none!important}
  .tb.on{background:none}
  main{padding:20px 14px 110px}
  .mtop{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:16px}.mtop i{width:28px;height:28px;font-size:14px}.mtop .th2{margin-left:auto}
  h2{font-size:24px}.inv{grid-template-columns:1fr}.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side"><div class="brand"><i>▣</i>Склад IThub</div><div id="nv" style="display:contents"></div><div class="hdl"><span>@warehouseIThubBot</span><button class="th2" data-a="theme" aria-label="Сменить тему">◐</button></div></aside>
  <main><div class="mtop"><i>▣</i>Склад IThub<button class="th2" data-a="theme" aria-label="Сменить тему">◐</button></div><div class="note" id="nt" hidden></div><div id="m"></div></main>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div class="toast" id="ts" hidden></div>
<script>
const $=s=>document.querySelector(s);
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',reqs:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',chat:'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z',stock:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',admin:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'};
const svg=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;
const TABS=[['home','Главная'],['reqs','Заявки'],['chat','Связь'],['stock','Склад'],['admin','Админ']];
const LOCS=['Евродвушка','Архив','Склад'];
const SL={ok:'одобрена',rej:'отклонена',wait:'на согласовании',out:'выдана',done:'закрыта'};
const TL={idea:'Идея',work:'В работе',done:'Готово'};
const SHEET='https://docs.google.com/spreadsheets/d/1bGYyEzD7nRimij4lZbinuupY2sE5E-vzRZ4ZTow5BmM/edit';
const S={inv:[],reqs:[],log:[],tasks:[]};
let db=null,dl=null,usr=null,me='',tab=(location.hash||'#home').slice(1),sub='',edit=false,lf='',q='',srt='ord',dr=null,di=null,rl=[],rk='get',tt,ud=null,rf='all',rq='',lq='',aud=new Set();
const pend={},sess={},NM={};
if(!TABS.some(x=>x[0]===tab))tab='home';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const match=n=>S.inv.find(v=>v.n.toLowerCase()===String(n).trim().toLowerCase());
const reserved=v=>S.reqs.filter(r=>r.s==='ok'&&r.k!=='ret').reduce((a,r)=>a+(r.it||[]).filter(z=>match(z[0])===v).reduce((b,z)=>b+z[1],0),0);
const low=v=>v.q!=null&&v.min!=null&&v.q<=v.min;
function toast(m,undo){const e=$('#ts');e.innerHTML=`<span>${esc(m)}</span>${undo?'<button id="un">Отменить</button>':''}`;e.hidden=false;ud=undo;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,4500)}
function note(m){const e=$('#nt');e.textContent=m||'';e.hidden=!m}
function theme(){const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}}
async function init(){
  try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
  render();
  try{if(window.claude){db=await claude.use('db');dl=await claude.use('downloads');usr=await claude.use('user');if(usr)me=await usr.id()}}catch(e){}
  if(!db){note('Хранилище недоступно: изменения не сохранятся после закрытия страницы.');return}
  const to=setTimeout(()=>note('Данные пока не загрузились. Возможно, нет связи.'),10000);
  const err=()=>note('Не удалось подключиться к хранилищу.');
  db.collection('inv').onSnapshot(s=>{clearTimeout(to);note('');const old=new Map(S.inv.map(v=>[v.id,v]));S.inv=s.docs.map(d=>pend[d.id]&&old.has(d.id)?old.get(d.id):{id:d.id,...d.data()}).sort((a,b)=>(a.ord??0)-(b.ord??0));render()},err);
  db.collection('reqs').onSnapshot(s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>parseInt(b.i)-parseInt(a.i));render()},err);
  db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render()},err);
  db.collection('log').orderBy('ts','desc').limit(150).onSnapshot(s=>{S.log=s.docs.map(d=>d.data());names();render()},err);
}
function names(){
  const ids=[...new Set(S.log.map(z=>z.u).filter(Boolean))].filter(i=>!NM[i]);
  if(!ids.length||!usr||!usr.profiles)return;
  usr.profiles(ids).then(p=>{ids.forEach(i=>NM[i]=(p[i]&&p[i].name)||'Участник');render()}).catch(()=>ids.forEach(i=>NM[i]='Участник'));
}
const who=u=>!u?'':(u===me?'вы':(NM[u]||'участник'));
const log=(t,x,i)=>{if(db)db.collection('log').add({ts:Date.now(),t,x,u:me||'',i:i||''}).catch(()=>{})};
function putInv(o,delay=0){
  const i=S.inv.findIndex(v=>v.id===o.id);if(i<0)S.inv.push(o);else S.inv[i]=o;
  S.inv.sort((a,b)=>(a.ord??0)-(b.ord??0));render();
  clearTimeout(pend[o.id]);
  pend[o.id]=setTimeout(async()=>{try{const{id,...d}=o;if(db)await db.doc('inv/'+id).set(d)}catch(e){toast('Не удалось сохранить изменение')}delete pend[o.id]},delay);
}
function bump(id,n){
  const v=S.inv.find(z=>z.id===id);if(!v)return;const prev=v.q;
  if(!sess[id])sess[id]={from:prev};
  v.q=n;putInv(v,500);
  clearTimeout(sess[id].t);
  sess[id].t=setTimeout(()=>{if(sess[id].from!==v.q)log('qty',`${v.n}: ${sess[id].from??'—'} → ${v.q??'—'}`,id);delete sess[id]},1500);
  toast(`${v.n}: ${prev??'—'} → ${n??'—'}`,()=>bump(id,prev));
}
const shrink=f=>new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r(null);im.src=u});
const stepper=(v,x)=>`<div class="sp" data-x="${x}"><button data-a="dec" aria-label="Минус один">−</button><input type="number" min="0" inputmode="numeric" data-a="num" value="${v??''}" placeholder="—" aria-label="Количество"><button data-a="inc" aria-label="Плюс один">+</button></div>`;
const back='<button class="ch" data-a="back" style="margin-bottom:14px">← Админка</button>';
function actions(r){
  const b=(a,t,c='')=>`<button class="btn sm ${c}" data-a="${a}" data-id="${r.id}">${t}</button>`;
  if(r.s==='wait')return b('rej','Отклонить','dg')+b('app','Одобрить','pr');
  if(r.s==='ok')return b('rej','Отклонить','dg')+(r.k==='ret'?b('back2','Принять возврат','pr'):b('issue','Выдать','pr'));
  if(r.s==='out')return b('back2','Принять возврат','pr');
  return '';
}
const reqRow=(r,adm)=>`<div class="ri ${adm?'':'clk'}" ${adm?'':`data-a="vreq" data-id="${r.id}"`}><div class="row"><b>${esc(r.e)}</b><span class="pl ${r.s}">${SL[r.s]}</span></div><div>${r.o||''}${r.b?' – '+r.b:''}${r.v?' · '+esc(r.v):''}</div><div class="mut">№${esc(r.i)} · ${r.k==='ret'?'возврат':'получение'}${(r.it||[]).length?' · '+r.it.map(z=>esc(z[0])+' ×'+z[1]).join(', '):''}</div>${adm?`<div class="row" style="justify-content:flex-end;margin-top:10px;gap:8px">${actions(r)}</div>`:''}</div>`;
function inventory(adm){
  const ed=adm||edit;
  let l=S.inv.filter(v=>(lf==='low'?low(v):(!lf||v.l===lf))&&(!q||v.n.toLowerCase().includes(q)));
  if(srt==='name')l=[...l].sort((a,b)=>a.n.localeCompare(b.n,'ru'));
  if(srt==='qty')l=[...l].sort((a,b)=>(a.q??1e9)-(b.q??1e9));
  const nl=S.inv.filter(low).length;
  return `<div class="top"><h2>${adm?'Наличие':'Склад'}</h2>${adm?'<button class="btn pr" data-a="add">+ Добавить</button>':`<button class="ch ${edit?'on':''}" data-a="edit">✎ Правка</button>`}</div>
  ${adm?back:''}
  <div class="bar"><input class="in" id="sq" placeholder="Поиск позиции (нажмите /)" value="${esc(q)}" style="flex:1;min-width:200px"><select class="in" id="srt" style="width:auto"><option value="ord" ${srt==='ord'?'selected':''}>По порядку</option><option value="name" ${srt==='name'?'selected':''}>По названию</option><option value="qty" ${srt==='qty'?'selected':''}>Сначала мало</option></select></div>
  <div class="bar"><button class="ch ${lf?'':'on'}" data-a="loc" data-l="">Все</button>${LOCS.map(o=>`<button class="ch ${lf===o?'on':''}" data-a="loc" data-l="${o}">${o}</button>`).join('')}<button class="ch ${lf==='low'?'on':''}" data-a="loc" data-l="low">Мало${nl?' · '+nl:''}</button></div>
  <div class="mut" style="margin:0 4px 10px">${l.length} позиций</div>
  <div class="inv">${l.map(v=>{const rs=reserved(v);return `<div class="card it" data-a="open" data-id="${v.id}">${v.ph?`<img class="th" src="${v.ph}" alt="">`:`<div class="th">${svg('stock',26)}</div>`}<div class="nm"><b>${esc(v.n)}</b><span class="loc">${v.l||'место не указано'}</span>${rs?`<span class="loc rsv">резерв ${rs}</span>`:''}${low(v)?'<span class="loc warn">мало</span>':''}</div>${ed?stepper(v.q,v.id):`<div class="qty">${v.q??'—'}</div>`}</div>`}).join('')}</div>${l.length?'':'<div class="mut" style="padding:30px;text-align:center">Ничего не найдено</div>'}`;
}
function vHome(){

function stock(r,sign){
  const miss=[],ch=[];
  (r.it||[]).forEach(z=>{const v=match(z[0]);if(!v){miss.push(z[0]);return}const from=v.q??0,to=Math.max(0,from+sign*z[1]);v.q=to;putInv(v,0);ch.push(`${v.n} ${from}→${to}`)});
  return{miss,ch};
}

  render();await saveReq(r);
}

  else if(a==='rdel'){const r=S.reqs.find(z=>z.id===id);S.reqs=S.reqs.filter(z=>z.id!==id);$('#dlg').close();render();try{if(db)await db.doc('reqs/'+id).delete();log('req',`Заявка №${r.i} удалена`)}catch(e){toast('Не удалось удалить')}}
  else if(a==='tadd')addTask();
  else if(a==='tcy'){const t=S.tasks.find(z=>z.id===id);t.s={idea:'work',work:'done',done:'idea'}[t.s];render();try{if(db){const{id:_,...d}=t;await db.doc('tasks/'+id).set(d)}}catch(e){toast('Не удалось сохранить')}}
  else if(a==='tdel'){S.tasks=S.tasks.filter(z=>z.id!==id);render();try{if(db)await db.doc('tasks/'+id).delete()}catch(e){}}
  else if(a==='aud'){aud.has(id)?aud.delete(id):aud.add(id);render()}
  else if(a==='audfin'){log('audit',`Инвентаризация: сверено ${S.inv.filter(v=>aud.has(v.id)).length} из ${S.inv.length} позиций`);toast('Инвентаризация записана в историю');aud=new Set();sub='';render()}
  else if(a==='x-inv')dsave('sklad.csv','\ufeff'+[['№','Позиция','Количество','Расположение','Мин. остаток','В резерве','Заметка'],...S.inv.map((v,i)=>[i+1,v.n,v.q??'',v.l,v.min??'',reserved(v),v.nt])].map(r=>r.map(csvc).join(',')).join('\n'));
  else if(a==='x-req')dsave('zayavki.csv','\ufeff'+[['№','Мероприятие','Площадка','Тип','Статус','Дата','Возврат','Позиции','Комментарий'],...S.reqs.map(r=>[r.i,r.e,r.v,r.k==='ret'?'возврат':'получение',SL[r.s],r.o,r.b,(r.it||[]).map(z=>z[0]+' x'+z[1]).join('; '),r.c])].map(r=>r.map(csvc).join(',')).join('\n'));
  else if(a==='x-json')dsave('sklad-backup.json',JSON.stringify({v:1,inv:S.inv,reqs:S.reqs,tasks:S.tasks}));
  else if(a==='x-imp')$('#imp').click();
  else if(a==='x-print'){try{print()}catch(er){toast('Печать недоступна в этом режиме')}}
});
document.addEventListener('change',async e=>{
  const z=e.target;
  if(z.dataset.a==='num'){
    const v=z.value===''?null:Math.max(0,Math.floor(+z.value)),sp=z.closest('.sp');
    if(sp.dataset.x==='d')dr.q=v;else bump(sp.dataset.x,v);
  }
  else if(z.id==='fph'&&z.files[0]){const d=await shrink(z.files[0]);if(d){dr.ph=d;pv();$('#phl').textContent='Заменить фото'}}
  else if(z.id==='imp'&&z.files[0]){
    try{
      const j=JSON.parse(await z.files[0].text());let n=0;
      for(const [col,key] of [['inv','inv'],['reqs','reqs'],['tasks','tasks']])for(const o of (j[key]||[])){const{id,...d}=o;if(id&&db){await db.doc(col+'/'+id).set(d);n++}}
      log('import',`Восстановлено из копии: ${n} записей`);toast(`Восстановлено записей: ${n}`);
    }catch(er){toast('Не удалось прочитать файл копии')}
    z.value='';
  }
});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)&&t!==tab){tab=t;sub='';render()}});
init();
</script>
