<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад IThub - Управление складом</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f2fa;
  --s1:#fff;
  --s2:#f0f0fa;
  --bd:rgba(30,30,70,.1);
  --ink:#15162b;
  --mut:#6d6f93;
  --ac:#6a5cf5;
  --ac2:#4f8bff;
  --ok:#12803f;
  --okb:#e3f6ea;
  --no:#c0267a;
  --nob:#fde8f2;
  --wt:#9a6a00;
  --wtb:#fff3d1;
  --sh:0 1px 2px rgba(20,20,60,.06),0 8px 24px rgba(20,20,60,.06);
  --radius:12px;
  --transition:.2s;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0e1d;
    --s1:#16172e;
    --s2:#1e2040;
    --bd:rgba(255,255,255,.08);
    --ink:#f4f4fc;
    --mut:#9b9dc4;
    --ac:#8d80ff;
    --ac2:#6aa0ff;
    --ok:#4ade80;
    --okb:#14352a;
    --no:#f472b6;
    --nob:#3a1a30;
    --wt:#fbbf24;
    --wtb:#3a2f12;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
html{scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
img,max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
img,svg{max-width:100%;display:block}
*:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
*/
/* ============================================================
   Layout
   ============================================================*/
.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr;gap:0}
.side{
  position:sticky;top:0;height:100vh;padding:20px 16px;background:var(--s1);
  border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:8px;z-index:20}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;padding:8px 12px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.topbar .user{font-size:12px;color:var(--mut);white-space:nowrap}
.topbar .theme-tgl{width:44px;height:24px;background:var(--s2);border-radius:99px;padding:2px;display:inline-flex;align-items:center;gap:4px}
.topbar .theme-tgl span{width:12px;height:12px;border-radius:50%;background:var(--ac);transition:var(--transition)}
.main{
  padding:24px;max-width:960px;width:100%;margin:0 auto;min-height:100vh;overflow:hidden
}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:20px;border-radius:var(--radius);margin-bottom:24px}
.hero h1{margin:0;font-size:24px;letter-spacing:-.02em}
.switcher{margin-top:12px;display:flex;gap:6px}
.switcher .btn{padding:6px 10px;font-size:12px;border-radius:var(--radius);background:var(--s2);color:var(--mut);border:0;cursor:pointer;transition:var(--transition)}
.switcher .btn.active{background:var(--ac);color:#fff}
.notice{background:var(--wtb);color:var(--wt);padding:8px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:16px;display:none}
.note{padding:10px 12px;border-radius:var(--radius);background:var(--wtb);color:var(--wt);font-size:12px;margin-bottom:12px;display:none}
*/
/* ============================================================
   Auth
   ============================================================*/
.auth-box{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:24px;max-width:380px;margin:0 auto;box-shadow:var(--sh)}
.auth-box h2{margin:0 0 16px;font-size:20px;letter-spacing:-.01em}
.auth-box .form-group{margin-bottom:12px}
.auth-box .form-group label{display:block;margin-bottom:4px;font-size:12px;color:var(--mut)}
.auth-box .form-group input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink)}
.auth-box .form-group input:focus{outline:0;border-color:var(--ac)}
.auth-box .btn{width:100%;padding:8px 12px;font-weight:600;border:0;border-radius:var(--radius);background:var(--ac);color:#fff;margin-top:4px;transition:var(--transition)}
.auth-box .btn:hover{background:var(--ac2)}
.auth-box .link{text-align:center;margin-top:10px;font-size:12px;color:var(--mut)}
.auth-box .link a{color:var(--ac)}
*/
/* ============================================================
   Nav
   ============================================================*/
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{padding:8px 10px;border-radius:var(--radius);color:var(--mut);font-weight:500;transition:var(--transition)}
.nav a:hover,.nav a.active{background:var(--s2);color:var(--ink)}
*/
/* ============================================================
   Catalog / List
   ============================================================*/
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:12px;transition:var(--transition);cursor:pointer}
.card:hover{border-color:var(--ac)}
.card .title{font-weight:600;margin-bottom:6px}
.card .price{color:var(--ok);font-weight:600;margin-top:4px}
.card .stock{color:var(--mut);font-size:12px;margin-top:4px}
.card .actions{margin-top:8px;display:flex;gap:4px}
.btn-small{padding:4px 8px;font-size:11px;border:0;border-radius:6px;background:var(--s2);color:var(--mut);cursor:pointer;transition:var(--transition)}
.btn-small:hover{background:var(--ac);color:#fff}
*/
/* ============================================================
   Auth Modals
   ============================================================*/
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.active{display:flex}
.modal{background:var(--s1);border-radius:var(--radius);padding:24px;width:90%;max-width:400px;transform:scale(0.9);transition:transform .2s}
.overlay.active .modal{transform:scale(1)}
.modal h2{margin:0 0 16px;font-size:18px;letter-spacing:-.01em}
.modal .form-group{margin-bottom:12px}
.modal .form-group label{display:block;margin-bottom:4px;font-size:12px;color:var(--mut)}
.modal .form-group input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink)}
.modal .form-group input:focus{outline:0;border-color:var(--ac)}
.modal .actions{margin-top:12px;display:flex;gap:6px}
.modal .btn{flex:1;padding:6px 10px;font-weight:600;border:0;border-radius:var(--radius);background:var(--ac);color:#fff}
.modal .btn.cancel{background:var(--s2);color:var(--mut);border:1px solid var(--bd)}
*/
/* ============================================================
   Responsive
   ============================================================*/
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:column;padding:12px 8px;border:0;border-top:1px solid var(--bd);z-index:20}
  .brand,.hdl{display:none}
  .main{padding:16px}
  .mtop{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}
  .mtop .hdl{display:none}
  h2{font-size:20px}
  .grid{grid-template-columns:1fr}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
*/
/* ============================================================
   IndexedDB (Dexie.js) - клиенты, заказы, товары
   ============================================================*/
</style>
</head>
<body>
<!-- ============================================================
   Auth Overlay
   ============================================================-->
<div id="authOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="authTitle" style="display:none">
  <div class="modal" id="authModal">
    <h2 id="authTitle">Вход в систему</h2>
    <div class="form-group"><label for="authLogin">Логин</label><input id="authLogin" type="text" placeholder="Введите логин"></div>
    <div class="form-group"><label for="authPass">Пароль</label><input id="authPass" type="password" placeholder="Введите пароль"></div>
    <div class="actions"><button class="btn" id="authBtn">Войти</button><button class="btn cancel" id="authCancel">Отмена</button></div>
  </div>
</div>

<!-- ============================================================
   Header / Topbar
   ============================================================-->
<header class="topbar">
  <div class="brand"><i>▣</i>Склад IThub</div>
  <div class="user" id="userGreeting">Гость</div>
  <div class="theme-tgl"><span data-theme="light"></span><span data-theme="dark"></span></div>
</header>

<!-- ============================================================
   Main Content
   ============================================================-->
<main class="main">
  <div class="mtop">
    <i>▣</i>Склад IThub<button class="th2" data-theme="light" aria-label="Сменить тему">◐</button>
  </div>
  <div class="note" id="notice" hidden></div>
  <div id="app"></div>
</div>

<!-- ============================================================
   IndexedDB (Dexie.js)
   ============================================================-->
<script src="https://cdn.jsdelivr.net/npm/dexie@latest/dist/dexie.min.js"></script>

<script>
const $=s=>document.querySelector(s);
// === 1. AUTH STATE & STORAGE ===
const USERS_KEY = 'sklad_users';
const TOKEN_KEY = 'sklad_token';

function login(user) {
  localStorage.setItem(TOKEN_KEY, user);
  sessionStorage.setItem('sklad_user', user);
  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('userGreeting').textContent = `Привет, ${user}`;
  showNotice(`Добро пожаловать, ${user}!`, 'success');
  renderCatalog();
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem('sklad_user');
  document.getElementById('userGreeting').textContent = 'Гость';
  document.getElementById('authOverlay').style.display = 'flex';
  document.getElementById('app').innerHTML = '';
  showNotice('Вы вышли из системы', 'info');
}

// Проверка сохраненного пользователя при загрузке
const savedUser = sessionStorage.getItem('sklad_user');
if (savedUser) {
  login(savedUser);
} else {
  document.getElementById('authOverlay').style.display = 'flex';
}

// === 2. DEXIE DB ===
const db = new Dexie('sklad_db');
db.version(1).stores({
  users: '++id, username, passwordHash',
  products: '++id, name, price, stock, createdAt',
  orders: '++id, userId, total, status, createdAt',
  orderItems: '++id, orderId, productId, quantity, price'
});

// Авто-создание тестовых данных при пустой БД
db.users.toArray().then(users => {
  if (!users.length) {
    db.users.bulkAdd([
      { username: 'admin', passwordHash: 'admin123' },
      { username: 'user', passwordHash: 'user123' }
    ]);
  }
});

// === 3. ЭЛЕМЕНТЫ ===
const authOverlay = document.getElementById('authOverlay');
const authModal = document.getElementById('authModal');
const authLogin = document.getElementById('authLogin');
const authPass = document.getElementById('authPass');
const authBtn = document.getElementById('authBtn');
const authCancel = document.getElementById('authCancel');
const userGreeting = document.getElementById('userGreeting');
const notice = document.getElementById('notice');
const app = document.getElementById('app');

function showNotice(msg, type = 'info') {
  notice.textContent = msg;
  notice.className = 'notice' + (type === 'success' ? ' success' : '');
  notice.style.display = 'block';
  setTimeout(() => notice.style.display = 'none', 5000);
}

// === 4. AUTH BUTTONS ===
authBtn.onclick = () => {
  const login = authLogin.value.trim();
  const pass = authPass.value.trim();
  if (!login || !pass) return showNotice('Введите логин и пароль', 'error');

  db.users.where('username').equals(login).first().then(user => {
    if (!user) return showNotice('Пользователь не найден', 'error');
    // Simple password check
    if (user.passwordHash !== pass) return showNotice('Неверный пароль', 'error');
    login(user.username);
  }).catch(e => showNotice('Ошибка доступа', 'error'));
};

authCancel.onclick = () => {
  document.getElementById('authOverlay').style.display = 'none';
  logout();
});

// === 5. CATALOG RENDER ===
function renderCatalog(filter = 'all') {
  db.products.toArray().then(products => {
    // Фильтр доступа: показываем только авторизованным или всем
    const showAll = !document.getElementById('userGreeting').textContent.includes('Гость') || filter === 'all';
    
    app.innerHTML = `
      <div class="grid" id="catalog">
        ${products.map(p => {
          const canView = showAll || (document.getElementById('userGreeting').textContent !== 'Гость');
          return `
            <div class="card" onclick="openProduct(${p.id})" ${!canView ? 'style="opacity:0.5;pointer-events:none;"' : ''}>
              <div class="title">${p.name}</div>
              <div class="price">${p.price ? `${p.price} ₽` : 'Цена уточняется'}</div>
              <div class="stock">Наличие: ${p.stock || 0} шт.</div>
              <div class="actions">
                <button class="btn-small" onclick="orderProduct(${p.id})" ${!canView ? 'disabled' : ''}>Купить</button>
                <button class="btn-small" onclick="viewProduct(${p.id})" ${!canView ? 'disabled' : ''}>Подробнее</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      ${products.length === 0 ? '<p style="text-align:center;color:var(--mut)">Товары еще не добавлены</p>' : ''}
    </div>`;
  });
}

// === 5. PRODUCT FUNCTIONS ===
function openProduct(id) {
  db.products.get(id).then(p => {
    app.innerHTML = `
      <div class="card" style="max-width:500px;margin:0 auto">
        <h3>${p.name}</h3>
        <p>${p.description || 'Описание отсутствует'}</p>
        <p><strong>Цена:</strong> ${p.price || 0} ₽</p>
        <p><strong>Наличие:</strong> ${p.stock || 0} шт.</p>
        <div style="margin-top:12px">
          <button class="btn-small" onclick="orderProduct(${p.id})">Оформить заказ</button>
          <button class="btn-small" onclick="renderCatalog()">Назад к каталогу</button>
        </div>
      </div>`;
      document.getElementById('notice').style.display = 'none';
    });
  }
}

function orderProduct(productId) {
  db.products.get(productId).then(p => {
    const user = db.users.where('username').equals(sessionStorage.getItem('sklad_user') || 'guest').first();
    if (!user) return showNotice('Сначала войдите в систему', 'error');

    db.orders.add({
      userId: 1, // в реальном приложении здесь был бы user.id
      total: p.price,
      status: 'pending'
    }).then(orderId => {
      db.orderItems.add({
        orderId,
        productId,
        quantity: 1,
        price: p.price
      }).then(() => {
        showNotice(`Заказ #${orderId} успешно создан!`, 'success');
        setTimeout(() => renderCatalog(), 1000);
      });
    });
  });
}

// === 6. THEME TOGGLE ===
document.querySelectorAll('.theme-tgl span').forEach(span => {
  span.addEventListener('click', () => {
    document.documentElement.dataset.theme = span.dataset.theme;
    localStorage.setItem('theme', span.dataset.theme);
  });
  if (localStorage.getItem('theme') === span.dataset.theme) document.documentElement.dataset.theme = span.dataset.theme;
});

// === 7. INIT ===
renderCatalog();
document.getElementById('notice').style.display = 'none';
})();
</script>
</body>
</html>
